project:
  name: "rag_system"
  version: "0.1.0"

paths:
  data_dir: "data"
  raw_pdf_dir: "data/raw"
  processed_dir: "data/processed"
  vector_store_dir: "data/vector_store"
  bm25_index_dir: "data/bm25_index"
  cache_dir: "data/cache"
  logs_dir: "logs"

pdf:
  max_file_size_mb: 100
  allowed_extensions: [".pdf"]

chunking:
  chunk_size: 512
  chunk_overlap: 64
  strategy: "recursive"

embedding:
  default_model: "intfloat/multilingual-e5-base"
  batch_size: 32
  dimension: 768

retrieval:
  top_k: 10
  hybrid_alpha: 0.5
  enable_query_translation: true
  translation_model: "Helsinki-NLP/opus-mt-ar-en"

reranking:
  top_n: 5
  model_name: "BAAI/bge-reranker-v2-m3"

llm:
  default_model: "gemma3:4b"
  ollama_base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 1024

logging:
  level: "INFO"
  file_name: "rag_system.log"
  max_bytes: 10485760
  backup_count: 5