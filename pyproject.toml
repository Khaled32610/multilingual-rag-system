[project]
name = "rag_system"
version = "0.1.0"
description = "Production-grade RAG system with benchmarking, hybrid retrieval, and evidence verification"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pypdf>=4.1.0",
    "pdfplumber>=0.11.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",
    "bm25s>=0.2.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
reports = [
    "reportlab>=4.2.0",
]
ui = [
    "streamlit>=1.38.0",
]
all = [
    "reportlab>=4.2.0",
    "streamlit>=1.38.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"